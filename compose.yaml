name: nevis

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
      POSTGRES_DB: nevis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job, not a long-running service: applies pending migrations and exits.
  # The API waits for it to complete so no worker ever races to alter the schema.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.27
    command: ["--wait", "migrate"]
    environment:
      DATABASE_URL: postgres://nevis:nevis@db:5432/nevis?sslmode=disable
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgres://nevis:nevis@db:5432/nevis?sslmode=disable
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?set API_BEARER_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-large}
      SUMMARY_BASE_URL: ${SUMMARY_BASE_URL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-google/gemini-2.5-flash-lite}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      CLIENT_SCORE_THRESHOLD: ${CLIENT_SCORE_THRESHOLD:-0.10}
      DOCUMENT_SCORE_THRESHOLD: ${DOCUMENT_SCORE_THRESHOLD:-0.38}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-20}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
